name: ci

# Local only: scripts/ci-local.sh runs it via gh act. No auto trigger.
on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TWITCH_FIXTURES: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      # official script: setup-bun took ~5 min under act
      - name: install bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: start server
        run: |
          bun run start &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: bun run smoke
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: bunx lhci autorun
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lighthouse
          path: .lighthouseci
